name: Canary Build Tests
on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering
  pull_request:
    paths:
      - '.github/workflows/canary-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-canary:
    runs-on: ubuntu-latest
    outputs:
      conda-spec: ${{ steps.discover.outputs.conda-spec }}
      python-versions: ${{ steps.discover.outputs.python-versions }}
      anaconda-anon-usage-spec: ${{ steps.discover.outputs.anaconda-anon-usage-spec }}
      anaconda-anon-usage-ref: ${{ steps.discover.outputs.anaconda-anon-usage-ref }}
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # The ubuntu-26.04 runner image (ubuntu-latest as of 2026-10-30) no
    # longer ships Miniconda, so $CONDA is empty. setup-miniconda installs
    # it and exports $CONDA for the next step.
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniconda-version: 'latest'
        auto-activate-base: true
        activate-environment: ''
        channels: defaults
    - name: Discover latest canary build
      id: discover
      run: $CONDA/bin/python tests/canary_versions.py >>$GITHUB_OUTPUT
  # The test job runs against whatever anaconda-anon-usage build is on
  # ctools/label/dev, which only advances when the post-merge Build upload
  # succeeds. Flag it here when that build lags main, so a failed upload
  # shows up as its own failure rather than as test failures.
  package-freshness:
    needs: discover-canary
    if: needs.discover-canary.outputs.anaconda-anon-usage-ref != ''
    runs-on: ubuntu-latest
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Check the canary package is built from main
      env:
        AAU_REF: ${{ needs.discover-canary.outputs.anaconda-anon-usage-ref }}
        # main.yml takes roughly 30-45 minutes from merge to upload; a canary
        # run that lands inside this window only warns.
        GRACE_SECONDS: 7200
      run: |
        main=$(git rev-parse origin/main)
        if ! pkg=$(git rev-parse --verify --quiet "$AAU_REF^{commit}"); then
          echo "::error::canary anaconda-anon-usage ref '$AAU_REF' is not in this repository"
          exit 1
        fi
        echo "canary package: $AAU_REF ($pkg)"
        echo "origin/main:    $main"
        if git merge-base --is-ancestor "$main" "$pkg"; then
          echo "canary package is current with main"
          exit 0
        fi
        behind=$(git rev-list --count "$pkg..$main")
        age=$(( $(date +%s) - $(git show -s --format=%ct "$main") ))
        msg="canary anaconda-anon-usage ($AAU_REF) is $behind commit(s) behind main (${main:0:7})"
        if [ "$age" -lt "$GRACE_SECONDS" ]; then
          echo "::warning::$msg; main moved ${age}s ago, upload may still be in progress"
          exit 0
        fi
        echo "::error::$msg; the post-merge Build upload to ctools/label/dev likely failed"
        exit 1
  test:
    needs: discover-canary
    if: needs.discover-canary.outputs.conda-spec != ''
    env:
      ANACONDA_ANON_USAGE_DEBUG: 1
      ANACONDA_ANON_USAGE_RAISE: 1
      PYTHONUNBUFFERED: 1
      # See main.yml: disable the libmamba-solver sharded-repodata cache to
      # avoid the intermittent "database is locked" flake. Note the `plugins.`
      # prefix. Remove once the base miniconda ships
      # conda-libmamba-solver >= 26.4.1.
      CONDA_PLUGINS_USE_SHARDED_REPODATA: "false"
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJson(needs.discover-canary.outputs.python-versions) }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # Run the test suite from the commit the canary package was built from,
    # so the tests match the installed code even if main has moved ahead.
    # The package-freshness job reports when that happens.
    - name: Check out the source matching the canary package
      env:
        AAU_REF: ${{ needs.discover-canary.outputs.anaconda-anon-usage-ref }}
      run: |
        echo "Workflow HEAD: $(git rev-parse --short HEAD)"
        echo "Testing anaconda-anon-usage source at: $AAU_REF"
        git checkout --detach "$AAU_REF"
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniconda-version: 'latest'
        auto-activate-base: true
        activate-environment: ''
        channels: defaults
    - name: Build test environment
      run: |
        cspec=${{ needs.discover-canary.outputs.conda-spec }}
        aspec=${{ needs.discover-canary.outputs.anaconda-anon-usage-spec }}
        pspec="python=${{ matrix.python-version }}"
        echo "-----------------------------"
        echo "CREATING BASE: $cspec $aspec $pspec"
        echo "-----------------------------"
        conda create -p ./testenv $aspec $cspec $pspec --file tests/requirements.txt
        echo "-------------------------"
        echo "CREATING TEST CHILD ENV 1"
        echo "-------------------------"
        mkdir -p ./testenv/envs
        conda create -p ./testenv/envs/testchild1 python --yes
        echo "-------------------------"
        echo "CREATING TEST CHILD ENV 2"
        echo "-------------------------"
        conda create -p ./testenv/envs/testchild2 python --yes
        if [ -f ./testenv/Scripts/conda.exe ]; then \
           sed -i.bak "s@CONDA_EXE=.*@CONDA_EXE=$PWD/testenv/Scripts/conda.exe@" testenv/etc/profile.d/conda.sh; \
        fi
        conda config --set solver classic
    - name: Test code
      run: |
        source testenv/etc/profile.d/conda.sh
        conda activate base
        conda info 2>&1 | tee output.txt
        if grep -q 'Error loading' output.txt; then exit -1; fi
        pytest --ignore=tests/test_rust_parity.py
        python tests/integration/test_config.py
    - name: Test heartbeats (pwsh)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        .\testenv\shell\condabin\conda-hook.ps1
        conda activate base
        python tests\integration\test_heartbeats.py powershell
    - name: Test heartbeats (cmd)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        call .\testenv\Scripts\activate.bat
        if %errorlevel% neq 0 exit 1
        python tests\integration\test_heartbeats.py cmd.exe
        if %errorlevel% neq 0 exit 1
    - name: Test heartbeats (bash)
      if: matrix.os != 'windows-latest'
      run: |
        source ./testenv/bin/activate
        conda info
        python tests/integration/test_heartbeats.py posix

  report:
    needs: [discover-canary, package-freshness, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Report results
      run: |
        echo "=== Debug: Job Outputs ==="
        echo "CONDA_SPEC: '${{ needs.discover-canary.outputs.conda-spec }}'"
        echo "AAU_SPEC: '${{ needs.discover-canary.outputs.anaconda-anon-usage-spec }}'"
        echo "AAU_REF: '${{ needs.discover-canary.outputs.anaconda-anon-usage-ref }}'"
        echo "PYTHON_VERSIONS: '${{ needs.discover-canary.outputs.python-versions }}'"
        echo "TEST_RESULT: '${{ needs.test.result }}'"
        echo "FRESHNESS_RESULT: '${{ needs.package-freshness.result }}'"
        echo "DISCOVER_RESULT: '${{ needs.discover-canary.result }}'"
        echo "=========================="

        CONDA_SPEC="${{ needs.discover-canary.outputs.conda-spec }}"
        AAU_SPEC="${{ needs.discover-canary.outputs.anaconda-anon-usage-spec }}"
        AAU_REF="${{ needs.discover-canary.outputs.anaconda-anon-usage-ref }}"
        PYTHON_VERSIONS="${{ needs.discover-canary.outputs.python-versions }}"
        TEST_RESULT="${{ needs.test.result }}"
        FRESHNESS_RESULT="${{ needs.package-freshness.result }}"

        echo "## Canary Build Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check if builds were found
        if [ -z "$CONDA_SPEC" ]; then
          echo "ℹ️ No canary builds available - tests skipped" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        echo "- **Conda:** $CONDA_SPEC" >> $GITHUB_STEP_SUMMARY
        echo "- **Python Versions Tested:** $PYTHON_VERSIONS" >> $GITHUB_STEP_SUMMARY
        echo "- **anaconda-anon-usage:** $AAU_SPEC (source ref: $AAU_REF)" >> $GITHUB_STEP_SUMMARY
        echo "- **Test Result:** $TEST_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Freshness:** $FRESHNESS_RESULT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        status=0
        if [ "$TEST_RESULT" == "skipped" ]; then
          echo "⏭️ Tests were skipped (no builds available)" >> $GITHUB_STEP_SUMMARY
        elif [ "$TEST_RESULT" != "success" ]; then
          echo "⚠️ Tests failed for $CONDA_SPEC" >> $GITHUB_STEP_SUMMARY
          status=1
        else
          echo "✅ All tests passed for $CONDA_SPEC" >> $GITHUB_STEP_SUMMARY
        fi
        if [ "$FRESHNESS_RESULT" != "success" ] && [ "$FRESHNESS_RESULT" != "skipped" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ anaconda-anon-usage on ctools/label/dev ($AAU_REF) is behind main; check the most recent post-merge Build run's upload job" >> $GITHUB_STEP_SUMMARY
          status=1
        fi
        exit $status
